services:
  semf-mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: semf-mobile
    restart: unless-stopped
    ports:
      - "${PORT:-8090}:8090"
    environment:
      - PORT=8090
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      - ROUTING_PROVIDER=${ROUTING_PROVIDER:-static_fallback}
      - ORS_API_KEY=${ORS_API_KEY:-}
      - DEFAULT_BBOX=${DEFAULT_BBOX:--66.0,-33.5,-63.5,-31.0}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8090/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
